<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b141c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <title>斗门智慧农田 · 农情监测大屏</title>
    <style>
      /* 应用启动前的画面：网速慢时也能看到「正在加载」，而不是一片空屏。应用一挂载，这段内容就被替换掉。 */
      html, body { margin: 0; min-height: 100%; background: #0b141c; color-scheme: dark; }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px;
        color: #aebfcd; font: 15px/1.6 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .boot a { color: #7ad3d0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg viewBox="1.87 -1.135 31.5 31.5" width="36" height="36" aria-hidden="true" style="color: #7ad3d0">
          <path d="M7.6 26.6C9.25 27.69 11.5 27.09 13.46 27.35C15.42 27.61 17.23 28.64 19.2 28.8C18.72 26.37 16.24 24.66 13.85 24.03C11.46 23.41 7.73 24.13 7.6 26.6Z" fill="currentColor" />
          <path d="M9.06 29.03C8.76 28.04 8.89 26.97 9.25 26C9.62 25.04 10.23 24.2 10.82 23.35A1.3 1.3 0 0 1 8.76 21.77C7.78 22.88 6.83 24.05 6.26 25.41C5.68 26.78 5.48 28.31 5.74 29.77A1.7 1.7 0 0 1 9.06 29.03Z" fill="currentColor" />
          <path d="M10.15 22.07C10.2 19.16 13.26 17.74 17.68 19.39C15.29 23.47 12.03 24.3 10.15 22.07ZM12.01 18.97C9.18 18.26 8.49 14.97 11.09 11.03C14.52 14.27 14.6 17.64 12.01 18.97ZM13.79 15.83C13.63 12.92 16.57 11.28 21.11 12.6C19.03 16.84 15.84 17.91 13.79 15.83ZM15.68 12.75C12.9 11.85 12.43 8.52 15.29 4.76C18.5 8.23 18.35 11.59 15.68 12.75ZM17.74 9.79C18 6.88 21.14 5.68 25.44 7.63C22.78 11.53 19.47 12.13 17.74 9.79ZM20.26 7.2C17.88 5.52 18.42 2.2 22.26 -0.54C24.3 3.72 23.16 6.89 20.26 7.2ZM23.6 5.2C23.63 2.87 26.07 1.72 29.61 3.01C27.73 6.28 25.12 6.97 23.6 5.2Z" fill="#ecc384" />
        </svg>
        <p>斗门智慧农田 · 正在加载</p>
      </div>
    </div>
    <noscript>
      <p style="margin: 24px; color: #aebfcd">这个大屏需要浏览器启用 JavaScript 才能显示。</p>
    </noscript>
    <script>
      // 应用挂载之前的两件事：加载久了提示检查网络；程序文件没加载成功时给出刷新入口。
      (function () {
        var boot = document.querySelector(".boot");
        var note = boot.querySelector("p");
        var timer = setTimeout(function () {
          note.textContent = "加载时间较长，请检查网络；一直没有内容就刷新页面。";
        }, 8000);
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK") && document.body.contains(boot)) {
            clearTimeout(timer);
            boot.innerHTML = '<p>页面程序没有加载成功。<a href="">重新加载</a></p>';
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
